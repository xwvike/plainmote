name: plainmote-dev

services:
  plainmote:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: plainmote:dev
    restart: unless-stopped
    init: true
    ports:
      - "8964:8964"
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: "postgres://plainmote:plainmote@postgres:5432/plainmote?sslmode=disable"
      PLAINMOTE_PUBLIC_URL: "${PLAINMOTE_PUBLIC_URL:-http://localhost:8964}"
      PLAINMOTE_BLOB_ENDPOINT: "http://rustfs:9000"
      PLAINMOTE_BLOB_BUCKET: plainmote
      PLAINMOTE_BLOB_REGION: us-east-1
      PLAINMOTE_BLOB_ACCESS_KEY: plainmote
      PLAINMOTE_BLOB_SECRET_KEY: plainmote-secret
      PLAINMOTE_TOKEN_KEY: "${PLAINMOTE_TOKEN_KEY:-0123456789abcdef0123456789abcdef}"
      PLAINMOTE_LOG_RETENTION: "${PLAINMOTE_LOG_RETENTION:-720h}"
      PLAINMOTE_REGISTRATION_MODE: "${PLAINMOTE_REGISTRATION_MODE:-open}"
      PLAINMOTE_ANONYMOUS: "${PLAINMOTE_ANONYMOUS:-false}"
      PLAINMOTE_TRUSTED_PROXIES: "${PLAINMOTE_TRUSTED_PROXIES:-}"
      PLAINMOTE_VISITOR_LOCATION: "${PLAINMOTE_VISITOR_LOCATION:-}"
      PLAINMOTE_OPERATOR: "${PLAINMOTE_OPERATOR:-}"
      PLAINMOTE_CONTACT_EMAIL: "${PLAINMOTE_CONTACT_EMAIL:-}"
      PLAINMOTE_SOURCE_URL: "${PLAINMOTE_SOURCE_URL:-}"
      PLAINMOTE_ADMIN_KEYS: "${PLAINMOTE_ADMIN_KEYS:-}"
      PLAINMOTE_ADMIN_ORIGINS: "${PLAINMOTE_ADMIN_ORIGINS:-}"
      PLAINMOTE_INDEXNOW_KEY: "${PLAINMOTE_INDEXNOW_KEY:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-dev-client}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-dev-secret}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      # A proxy set for Docker (~/.docker/config.json) reaches every container,
      # and cannot resolve the names of the services beside it.
      NO_PROXY: "rustfs,postgres,localhost,127.0.0.1"
      no_proxy: "rustfs,postgres,localhost,127.0.0.1"
    volumes:
      - .:/src
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: plainmote
      POSTGRES_USER: plainmote
      POSTGRES_PASSWORD: plainmote
    ports:
      - "54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plainmote -d plainmote"]
      interval: 2s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: plainmote
      RUSTFS_SECRET_KEY: plainmote-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Creates the bucket with a signed S3 request; an existing one answers 409.
  rustfs-init:
    image: rustfs/rustfs:1.0.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        status=$$(curl -s --noproxy '*' -o /dev/null -w '%{http_code}' --aws-sigv4 'aws:amz:us-east-1:s3'
        --user plainmote:plainmote-secret -X PUT http://rustfs:9000/plainmote);
        [ "$$status" = 200 ] || [ "$$status" = 409 ]
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  postgres_data:
  rustfs_data:
