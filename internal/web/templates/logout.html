{{define "logout.html"}}<!doctype html>
<html lang="{{.Locale}}"{{if .Theme.Current}} data-theme="{{.Theme.Current}}"{{end}}>
<head>
  {{template "htmlhead" .}}
  <title>PlainMote · {{tr .Locale "logout"}}</title>
</head>
<body>
  <main class="signin">
    <div class="panel signin-card">
      <img class="signin-mark" src="{{asset "logo.png"}}" alt="" width="64" height="64" decoding="async">
      <h1 class="signin-name">{{tr .Locale "logout"}}</h1>
      <p class="hint signin-lede">{{tr .Locale "logout_confirm"}}</p>
      <div class="rule"></div>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <button type="submit" class="pri signin-go">{{tr .Locale "logout"}}</button>
      </form>
      <a class="txt" href="/">{{tr .Locale "cancel"}}</a>
    </div>
  </main>
</body>
</html>{{end}}
