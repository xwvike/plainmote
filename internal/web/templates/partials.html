{{define "htmlhead"}}<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Webfont is optional: delete the two lines below to run without any external request;
       the stacks in style.css fall back to Helvetica / system-ui and SFMono / Menlo. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/logo.png" type="image/png" sizes="256x256">
  <link rel="apple-touch-icon" href="/static/logo.png">{{end}}

{{define "mark"}}<img class="mk" src="/static/logo.png" alt="" width="18" height="18" decoding="async">{{end}}

{{define "topbar"}}<div class="top"><div class="topin">
    <span class="brand"><a href="/">{{template "mark"}}<b>PlainMote</b></a></span>
    <nav class="nav">
      <a href="/"{{if eq .Active "resources"}} class="on" aria-current="page"{{end}}>资源</a>
      <a href="/logs"{{if eq .Active "logs"}} class="on" aria-current="page"{{end}}>访问记录</a>
    </nav>
    <div class="rt">
      <span class="who">{{.User.Login}}</span>
      <form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{.CSRF}}"><button type="submit" class="sm">退出</button></form>
    </div>
  </div></div>{{end}}

{{define "chev"}}<svg class="chev" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M3.5 1.5 L7 5 L3.5 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"></path></svg>{{end}}
