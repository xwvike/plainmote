{{define "media.html"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>PlainMote</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{asset "media.css"}}">
  <script src="{{asset "media.js"}}" defer></script>
  {{if .MediaAutoSave}}<noscript><meta http-equiv="refresh" content="0; url={{.MediaSource}}"></noscript>{{end}}
</head>
<body>
  {{/* Without a script a browser starts the download itself through the
       noscript refresh above; the button stays for one that blocks refreshes.
       With a script, media.js replaces it with the player. */}}
  <main data-media-source="{{.MediaSource}}"
        data-loading="Loading…"
        data-link-expired="The share link has expired or its use limit was reached."
        data-load-failed="The file could not be loaded. Try again later."
        data-type-changed="The file type changed and can no longer be played."
        data-unsupported="Your browser cannot play this format. You can "
        data-download="download the file"
        data-network-failed="The file could not be loaded. Check your connection."><p role="status"><a class="download" href="{{.MediaSource}}" download>Download file</a></p></main>
</body>
</html>{{end}}
