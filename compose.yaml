name: plainmote

services:
  plainmote:
    build:
      context: .
    image: plainmote:local
    restart: unless-stopped
    init: true
    # Loopback by default; set PLAINMOTE_BIND to 0.0.0.0 to publish wider.
    ports:
      - "${PLAINMOTE_BIND:-127.0.0.1}:${PLAINMOTE_PORT:-8964}:8964"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65532:65532"
    environment:
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL}"
      PLAINMOTE_PUBLIC_URL: "${PLAINMOTE_PUBLIC_URL:?set PLAINMOTE_PUBLIC_URL}"
      PLAINMOTE_BLOB_ENDPOINT: "${PLAINMOTE_BLOB_ENDPOINT:?set PLAINMOTE_BLOB_ENDPOINT}"
      PLAINMOTE_BLOB_BUCKET: "${PLAINMOTE_BLOB_BUCKET:?set PLAINMOTE_BLOB_BUCKET}"
      PLAINMOTE_BLOB_REGION: "${PLAINMOTE_BLOB_REGION:-auto}"
      PLAINMOTE_BLOB_ACCESS_KEY: "${PLAINMOTE_BLOB_ACCESS_KEY:?set PLAINMOTE_BLOB_ACCESS_KEY}"
      PLAINMOTE_BLOB_SECRET_KEY: "${PLAINMOTE_BLOB_SECRET_KEY:?set PLAINMOTE_BLOB_SECRET_KEY}"
      PLAINMOTE_TOKEN_KEY: "${PLAINMOTE_TOKEN_KEY:?set PLAINMOTE_TOKEN_KEY}"
      PLAINMOTE_TRUSTED_PROXIES: "${PLAINMOTE_TRUSTED_PROXIES:-}"
      PLAINMOTE_SESSION_TTL: "${PLAINMOTE_SESSION_TTL:-720h}"
      PLAINMOTE_MAX_CONTENT_MIB: "${PLAINMOTE_MAX_CONTENT_MIB:-4}"
      PLAINMOTE_LOG_RETENTION: "${PLAINMOTE_LOG_RETENTION:-720h}"
      PLAINMOTE_REGISTRATION_MODE: "${PLAINMOTE_REGISTRATION_MODE:-allowlist}"
      PLAINMOTE_ANONYMOUS: "${PLAINMOTE_ANONYMOUS:-false}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET}"
      GITHUB_ALLOWED_IDS: "${GITHUB_ALLOWED_IDS:-}"
